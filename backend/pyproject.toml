[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - A simple and universal swarm intelligence engine that predicts everything."
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    # LLM Related
    "openai>=1.86.0,<2",
    "anthropic>=0.40.0,<1",
    # Neo4j Graph Database
    "neo4j==5.23.0",
    # LangChain Community (Neo4j Image Integration)
    "langchain-community>=0.2.0",
    # OASIS Social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports text files with non-UTF-8 encoding)
    "charset-normalizer>=3.0.0",
    "chardet>=7.1.0",
    # Tool Library
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
